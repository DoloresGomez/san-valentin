<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmado</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="confirmation-page">
    <div class="confirmation-container">
        <h1 class="confirm-title">Confirmado<br>oficialmente:</h1>
        
        <div class="heart-shape">
            <div class="heart-content">
                <div class="heart-decoration">✨💕✨</div>
                <p class="confirm-message">Eres mi San<br>Valentín.</p>
                <div class="locket">
                    <div class="locket-letter">D</div>
                    <div class="locket-letter">J</div>
                </div>
            </div>
        </div>

        <p class="thanks-message">
            Gracias por decir que sí.<br>
            Prepárate para un día bonito,<br>
            sonrisas inevitables<br>
            y recuerdos que se van a quedar.
        </p>
    </div>
</body>
</html>
