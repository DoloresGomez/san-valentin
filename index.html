<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Especial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="envelope-page">
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-back"></div>
        <div class="envelope-back">
    <!-- Corazón decorativo -->
    <div class="heart-decoration">💕</div>
    
    <!-- Texto "Te Quiero" -->
    <div class="te-quiero">Te Quiero</div>
    
    <!-- Sello de lacre -->
    <div class="wax-seal">❤️</div>
    
    <!-- Estampilla -->
    <div class="postage-stamp">
        <div class="stamp-icon">🌹</div>
        <div class="stamp-date">14 FEB 2026</div>
    </div>
    
    <!-- Matasellos -->
    <div class="postmark">
        <div class="postmark-lines">|||||||</div>
        <div class="postmark-text">AMOR</div>
        <div class="postmark-date">2-06</div>
    </div>
</div>

        <div class="envelope-flap" id="envelopeFlap"></div>
        <div class="letter-content" id="letterContent">
            <div class="stamp">💌</div>
            <p class="surprise-text"><strong>Te tengo una sorpresa.</strong></p>
            <p class="instruction-text">Para descubrirla<br>da click sobre el corazón</p>
            <div class="heart" id="heartButton">❤️</div>
            <div class="sender-info">
                <p><em>De:</em> Dolores</p>
                <p><em>Para:</em> Jocelin</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
