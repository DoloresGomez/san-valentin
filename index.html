<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Especial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="envelope-page">
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-back"></div>
        <div class="envelope-flap" id="envelopeFlap"></div>
        <div class="letter-content" id="letterContent">
            <div class="stamp">💌</div>
            <p class="surprise-text"><strong>Te tengo una sorpresa.</strong></p>
            <p class="instruction-text">Para descubrirla<br>da click sobre el corazón</p>
            <div class="heart" id="heartButton">❤️</div>
            <div class="sender-info">
                <p><em>De:</em> Dolores</p>
                <p><em>Para:</em> Jocelin</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
